worker_processes  1;
pid /var/lib/aa_nginx/tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 30m;
    client_body_buffer_size 16m;
    client_body_temp_path /var/lib/aa_nginx/tmp/client_body;

    server {
        listen 80;
        server_name  _;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;

        # Upload files — no request buffering for large uploads
        location /uploads/ {
            proxy_pass http://127.0.0.1:5184;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        # API — no request buffering to speed up image uploads
        location /api/ {
            proxy_pass http://127.0.0.1:5184;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        # All other requests (including static assets)
        location / {
            proxy_pass http://127.0.0.1:5184;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_max_temp_file_size 0;
        }
    }
}
